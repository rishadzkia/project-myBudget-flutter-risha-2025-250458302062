name: my_budget
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  bloc: ^9.2.1
  dartz: ^0.10.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_spinkit: ^5.2.2
  freezed_annotation: ^2.4.4
  google_fonts: ^8.1.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^2.5.7
  build_runner: ^2.5.4 

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
    - assets/onboard/
    - assets/auth/
    - assets/icons/
    - assets/icons/biru/
    - assets/icons/kategori/
    - assets/icons/nav/
    - assets/maskot/
